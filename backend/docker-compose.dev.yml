services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: smm_api
    ports:
      - "8000:8000"
      - "5678:5678"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./collectors:/app/collectors
      - ./processor:/app/processor
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - smm_network
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: smm_migration
    command: [ "alembic", "upgrade", "head" ]
    environment:
      - DATABASE_URL=postgresql+psycopg://smm_user:dev_password@postgres:5432/social_monitor
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smm_network
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg15
    container_name: smm_postgres
    environment:
      POSTGRES_DB: social_monitor
      POSTGRES_USER: smm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "6454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/postgres/indexes:/docker-entrypoint-initdb.d/indexes
    networks:
      - smm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm_user -d social_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis/redis-stack:7.2.0-v6
    container_name: smm_redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - smm_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  loki:
    image: grafana/loki:3.5
    container_name: smm_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./infra/loki/local-config.yaml:/etc/loki/local-config.yaml
    networks:
      - smm_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  grafana:
    image: grafana/grafana:12.1.1
    container_name: smm_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - smm_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.1
    container_name: smm_alloy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/alloy:/etc/alloy:ro
      - ./infra/alloy/data:/var/lib/alloy
    networks:
      - smm_network
    environment:
      ALLOY_CONFIG: /etc/alloy/config.alloy
      ALLOY_ENVIRONMENT: ${ALLOY_ENVIRONMENT:-dev}
      ALLOY_CLUSTER_NAME: ${ALLOY_CLUSTER_NAME:-smm-cluster}
      ALLOY_APP_NAME: ${ALLOY_APP_NAME:-social-media-monitor}
      ALLOY_INCLUDE_CONTAINERS: ${ALLOY_INCLUDE_CONTAINERS:-smm_.*}
      ALLOY_EXCLUDE_CONTAINERS: ${ALLOY_EXCLUDE_CONTAINERS:-smm_alloy|smm_api}
      LOKI_HOST: ${LOKI_HOST:-loki}
      LOKI_PORT: ${LOKI_PORT:-3100}
    command: run --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:12345/-/healthy || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "5266:12345"
      - "4317:4317"
      - "4318:4318"
    restart: no

  supertokens:
      image: registry.supertokens.io/supertokens/supertokens-postgresql:11.0.6
      container_name: smm_supertokens_dev
      ports:
        - "3567:3567"
      environment:
        API_KEYS: "dev_apid_key_1234545454545454545"
        DISABLE_TELEMETRY: "true"
      volumes:
        - ./infra/supertokens/config.yml:/usr/lib/supertokens/config.yaml
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - smm_network
      restart: unless-stopped

  # Stream Processor
  processor:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: smm_processor
    command: ["python", "-m", "processor.main"]
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./processor:/app/processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - smm_network
    restart: no

  # Data Collectors (managed by collector manager)
  collectors:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: smm_collectors
    env_file:
      - .env
    volumes:
      - ./collectors:/app/collectors
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smm_network
    restart: no

networks:
  smm_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:
